[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend"]

[project]
name = "future-me"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ag2[openai,ag-ui]==0.12.2",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
